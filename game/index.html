<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Turkey Run 3D — Escape the Farmer!</title>
<link rel="icon" href="data:,">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1c2233; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #fff; }
  #game { display: block; width: 100vw; height: 100vh; touch-action: none; }
  #hud {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 12px 16px; pointer-events: none; z-index: 5;
    text-shadow: 0 2px 3px rgba(0,0,0,.9), 0 0 8px rgba(0,0,0,.65); font-weight: 700;
  }
  #hud .col { display: flex; flex-direction: column; gap: 4px; }
  #hud .right { align-items: flex-end; text-align: right; }
  #hud-score { font-size: 28px; }
  #hud-distance { font-size: 20px; }
  #hud-lives { font-size: 22px; color: #ff5a5a; letter-spacing: 2px; }
  #hud-stage { font-size: 15px; letter-spacing: 2px; color: #ffd76e; }
  #hud-speed, #hud-corn { font-size: 15px; }
  #hud-toast {
    position: fixed; top: 92px; left: 0; right: 0; z-index: 6;
    text-align: center; pointer-events: none;
    font-size: 22px; font-weight: 900; letter-spacing: 1px; color: #ffd76e;
    text-shadow: 0 2px 3px rgba(0,0,0,.9), 0 0 10px rgba(0,0,0,.65);
    opacity: 0; transition: opacity .25s;
  }
  #farmer-bar {
    width: 180px; height: 12px; border: 2px solid #fff; border-radius: 6px;
    background: rgba(0,0,0,.45); overflow: hidden;
  }
  #farmer-fill { height: 100%; width: 0%; background: hsl(120 80% 45%); }
  #farmer-label { font-size: 13px; }
  #overlay {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    text-align: center; padding: 24px;
    background: rgba(10, 14, 24, .55);
  }
  #overlay-title { font-size: 52px; font-weight: 900; letter-spacing: 1px; text-shadow: 0 4px 0 rgba(0,0,0,.4); }
  #overlay-sub { font-size: 19px; margin-top: 12px; max-width: 560px; line-height: 1.5; }
  #overlay-score { font-size: 24px; font-weight: 800; margin-top: 16px; color: #ffd76e; }
  #overlay-hint { font-size: 15px; margin-top: 22px; white-space: pre-line; line-height: 1.7; opacity: .9; }
  #loading {
    position: fixed; inset: 0; z-index: 20; background: #1c2233;
    display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 16px;
  }
  #loading p { font-size: 20px; font-weight: 700; }
  #loading-track { width: 280px; height: 12px; border: 2px solid #fff; border-radius: 6px; overflow: hidden; }
  #loading-bar { height: 100%; width: 0%; background: #ffd76e; }
  @media (max-width: 640px) {
    #overlay-title { font-size: 32px; }
    #hud-score { font-size: 22px; }
    #farmer-bar { width: 120px; }
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.min.js",
    "three/addons/": "./vendor/addons/"
  }
}
</script>
</head>
<body>
<canvas id="game" width="1280" height="720"></canvas>
<div id="hud">
  <div class="col">
    <div id="hud-score">0</div>
    <div id="hud-distance">0 m</div>
    <div id="hud-stage">FARMYARD</div>
  </div>
  <div class="col right">
    <div id="hud-lives">❤❤❤</div>
    <div id="farmer-bar"><div id="farmer-fill"></div></div>
    <div id="farmer-label">Farmer chasing</div>
    <div id="hud-speed">12 m/s</div>
    <div id="hud-corn">🌽 0</div>
  </div>
</div>
<div id="hud-toast"></div>
<div id="overlay" style="display:none">
  <div id="overlay-title">🦃 TURKEY RUN 3D</div>
  <div id="overlay-sub"></div>
  <div id="overlay-score"></div>
  <div id="overlay-hint"></div>
</div>
<div id="loading">
  <p>🦃 Loading Turkey Run 3D...</p>
  <div id="loading-track"><div id="loading-bar"></div></div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
